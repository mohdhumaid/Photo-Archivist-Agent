# Photo Archivist Agent — tunable defaults (RULEs live in OPERATING_CONTEXT.md)
timezone_default: Asia/Kolkata
thresholds:
  promote: 0.80      # score >= this -> file into existing folder
  review_low: 0.60   # 0.60-0.79 -> _Review/, <0.60 -> new folder
unnamed_face_ask_N: 3
exclude:
  - ".DS_Store"
  - "Thumbs.db"
  - "*.THM"
  - "*.AAE"
  - ".git/*"
hardlink: false        # true only allows hardlink on same volume, else full copy
organised_dir: Organised
index_db: index.db
undo_log: undo.log
ocr:
  backend: tesseract
  only_if_no_text_layer: true
geocode:
  offline_db: data/gazetteer.db
faces:
  local_only: true
  match_threshold: 0.60
  library: faces_library.json   # local-only biometrics (git-ignored)
embeddings:
  backend: hash    # local hash ONLY — org policy forbids model downloads
vision:
  backend: mock   # mock | llm  ("local" needs model downloads: blocked by org policy)

# Purple Fabric Magic Platform — the ONLY AI backend (org policy: no model
# downloads from Hugging Face or any other site; this repo has no local AI).
# Flow mirrors the platform sample: GET accesstoken -> POST invokeasset/genai
# (Input_Text) -> poll invokeasset/<trace_id> until COMPLETED.
llm:
  enabled: false            # true -> vision step calls the Purple Fabric asset
  base_url: ""              # e.g. https://dev-api.auuat.bank.in
  asset_id: ""              # PF agent asset id (ASSET_ID in the sample script)
  api_key_env: PF_API_KEY   # export PF_API_KEY='...' — never store secrets here
  username_env: PF_USERNAME
  password_env: PF_PASSWORD
  api_key: ""               # fallback if env vars are unset — do NOT commit real values
  username: ""
  password: ""
  poll_interval: 5          # seconds between result polls
  poll_timeout: 300         # give up polling after this many seconds
  send_images: false        # true = embed image bytes inside Input_Text (10 MB cap)

# People library: confirmed names + org role map (local only; never uploaded)
people: {}
roles:
  MD: ""
  CFO: ""
