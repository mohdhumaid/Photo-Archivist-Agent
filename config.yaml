# Photo Archivist Agent — tunable defaults (RULEs live in OPERATING_CONTEXT.md)
timezone_default: Asia/Kolkata
thresholds:
  promote: 0.80      # score >= this -> file into existing folder
  review_low: 0.60   # 0.60-0.79 -> _Review/, <0.60 -> new folder
unnamed_face_ask_N: 3
exclude:
  - ".DS_Store"
  - "Thumbs.db"
  - "*.THM"
  - "*.AAE"
  - ".git/*"
hardlink: false        # true only allows hardlink on same volume, else full copy
organised_dir: Organised
index_db: index.db
undo_log: undo.log
ocr:
  backend: tesseract
  only_if_no_text_layer: true
geocode:
  offline_db: data/gazetteer.db
faces:
  local_only: true
  match_threshold: 0.60
  library: faces_library.json   # local-only biometrics (git-ignored)
embeddings:
  backend: auto      # auto = sentence-transformers when installed, else hash
  text_model: all-MiniLM-L6-v2
  image_model: ViT-B-32
vision:
  backend: mock   # mock | local | llm

# Purple Fabric LLM (optional) — Automation Digital Expert, created in Agent
# Designer with the Perspective (system prompt) documented in README.md.
llm:
  enabled: false            # true -> vision step calls the Purple Fabric agent
  invoke_url: ""            # POST endpoint of the automation agent (from PF)
  agent_id: photo-archivist-expert
  model: claude-sonnet-4-5  # or gpt-5.2 — selected on the agent in PF Agent Designer
  api_key_env: PURPLE_FABRIC_API_KEY  # key read from this env var, never stored here
  timeout: 60
  send_images: false        # false = text-first (privacy); true attaches image bytes

# People library: confirmed names + org role map (local only; never uploaded)
people: {}
roles:
  MD: ""
  CFO: ""
