# Photo Archivist Agent — tunable defaults (RULEs live in OPERATING_CONTEXT.md)
timezone_default: Asia/Kolkata
thresholds:
  promote: 0.80      # score >= this -> file into existing folder
  review_low: 0.60   # 0.60-0.79 -> _Review/, <0.60 -> new folder
unnamed_face_ask_N: 3
exclude:
  - ".DS_Store"
  - "Thumbs.db"
  - "*.THM"
  - "*.AAE"
  - ".git/*"
hardlink: false        # true only allows hardlink on same volume, else full copy
organised_dir: Organised
index_db: index.db
undo_log: undo.log
ocr:
  backend: tesseract
  only_if_no_text_layer: true
geocode:
  offline_db: data/gazetteer.db
faces:
  local_only: true
  match_threshold: 0.40   # SFace FR_COSINE official threshold is 0.363; 0.60 never matched
  library: faces_library.json   # local-only biometrics (git-ignored)
embeddings:
  backend: hash    # local hash ONLY — org policy forbids model downloads
vision:
  backend: vllm   # mock | vllm  (vllm = local vLLM or LiteLLM gateway; llm = legacy alias of vllm)

# Local / gateway vision LLM — OpenAI-compatible /chat/completions.
# Pick ONE of the two blocks below.
vision_llm:
  enabled: true
  # LiteLLM gateway (Bearer key from .env -> LLM_API_KEY; never in this file)
  base_url: "https://dev-broccoli-apillmgov.auuat.bank.in/apillmgov/v1/chat/completions"
  model: "Qwen3 Vision 235b"
  # --- Option A alternative: self-hosted vLLM (usually no key) ---
  # base_url: "http://127.0.0.1:8000/v1/chat/completions"
  # model: "Qwen/Qwen3-VL-8B-Thinking-FP8"
  api_key_env: LLM_API_KEY   # export LLM_API_KEY='sk-...' — never store secrets here
  api_key: ""                # fallback if env var unset — do NOT commit real values
  temperature: 0.2
  max_tokens: 1024
  timeout: 120
  video_mode: keyframe   # keyframe (portable, default) | file_url (vLLM file:// style)
  max_image_mb: 10       # images above this are referenced, not base64-embedded

# People library: confirmed names + org role map (local only; never uploaded)
people: {}
roles:
  MD: ""
  CFO: ""
