# Optional role code -> person name. During `search`, if the query mentions a
# role keyword (e.g. "MD letter", "CEO photo", "ED review"), the role is resolved to the
# person's name and used as a person filter against the index.
# Example: searching 'MD signed letter' becomes person="Sanjay Agarwal".
